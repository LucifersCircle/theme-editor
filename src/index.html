<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paperback Theme Editor</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header class="toolbar">
    <h1 class="toolbar-title">Paperback Theme Editor</h1>
    <div class="toolbar-actions">
      <div class="split-btn" id="reset-group">
        <button id="btn-reset" class="btn split-btn-main">Reset to: .9 default</button>
        <button id="btn-reset-toggle" class="btn split-btn-toggle" aria-label="Choose reset theme" aria-expanded="false" aria-controls="reset-dropdown">&#9662;</button>
        <div id="reset-dropdown" class="split-dropdown hidden">
          <!-- populated by JS from manifest -->
        </div>
      </div>
      <button id="btn-import" class="btn" title="Import .pbcolors">Import</button>
      <button id="btn-export" class="btn" title="Export .pbcolors">Export</button>
      <input type="file" id="file-input" accept=".pbcolors" hidden>
    </div>
  </header>

  <nav class="mobile-view-switch" aria-label="Workspace view">
    <button id="btn-mobile-colors" type="button" aria-pressed="true" aria-controls="editor-content">Colors</button>
    <button id="btn-mobile-preview" type="button" aria-pressed="false" aria-controls="preview-panel">Preview</button>
  </nav>

  <main class="workspace preview-hidden" data-mobile-panel="colors">
    <section class="panel editor-panel">
      <div class="panel-header">
        <h2 id="editor-title">Editor</h2>
        <div class="editor-controls">
          <button id="btn-global-link" class="global-link-btn linked" title="All colors linked (light = dark)" aria-label="Link all colors between Light and Dark" aria-pressed="true"><span class="control-label">Modes linked</span></button>
          <div class="mode-toggle">
            <button id="btn-light" class="mode-btn" aria-pressed="false">Light</button>
            <button id="btn-dark" class="mode-btn active" aria-pressed="true">Dark</button>
          </div>
          <button id="btn-preview-toggle" class="preview-toggle-btn" title="Show preview panel" aria-label="Show preview panel" aria-expanded="false" aria-controls="preview-panel"><span class="control-label">Show preview</span></button>
        </div>
      </div>
      <div id="editor-content" class="panel-body">
        <!-- Color pickers will be generated here -->
      </div>
    </section>

    <section id="preview-panel" class="panel preview-panel collapsed">
      <div class="panel-header">
        <h2>Preview</h2>
        <span class="preview-mobile-hint">Tap a color to edit</span>
        <button id="btn-preview-last-color" class="preview-last-color" type="button" hidden>
          <span id="preview-last-color-name"></span>
          <span class="preview-last-color-swatch" aria-hidden="true"></span>
        </button>
      </div>
      <div id="preview-content" class="panel-body">
        <!-- Preview components will be loaded here -->
      </div>
      <section id="preview-color-editor" class="preview-color-editor" hidden aria-label="Preview color editor">
        <div class="preview-color-editor-heading">
          <button id="btn-preview-color-link" class="preview-color-editor-title" type="button" aria-pressed="false">
            <strong id="preview-color-name"></strong>
            <span id="preview-color-context"><span id="preview-color-applies"></span><span id="preview-color-link-label"></span><span id="preview-color-opacity"></span></span>
          </button>
          <button id="btn-preview-color-done" class="btn" type="button">Done</button>
        </div>
        <div class="preview-color-editor-controls">
          <div id="preview-color-field" class="preview-color-field" tabindex="0" role="group" aria-label="Saturation and brightness" aria-describedby="preview-color-field-help">
            <span id="preview-color-thumb" aria-hidden="true"></span>
          </div>
          <span id="preview-color-field-help" class="visually-hidden">Drag to change saturation and brightness. Use Left and Right for saturation, Up and Down for brightness. Hold Shift for larger steps.</span>
          <div class="preview-color-values">
            <label class="preview-color-hue-row"><span>Hue</span><input id="preview-color-hue" type="range" min="0" max="360" step="1" value="0"></label>
            <div class="preview-color-value-row">
              <span id="preview-color-swatch" aria-hidden="true"></span>
              <label for="preview-color-hex" class="visually-hidden">Hex color</label>
              <input id="preview-color-hex" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="#RRGGBB" aria-label="Hex color" aria-describedby="preview-color-hex-error">
              <button id="btn-preview-color-undo" class="btn" type="button">Undo</button>
            </div>
            <span id="preview-color-hex-error" class="preview-color-hex-error" role="status" hidden></span>
          </div>
        </div>
        <div class="preview-color-history">
          <select id="preview-color-history-kind" aria-label="Color history">
            <option value="recent">Recent</option>
            <option value="favorites">Favorites</option>
          </select>
          <div id="preview-color-history-list" class="preview-color-history-list" aria-label="Recent colors"></div>
          <button id="btn-preview-favorite" class="btn" type="button" aria-pressed="false">Favorite</button>
        </div>
      </section>
    </section>
  </main>

  <dialog id="export-dialog" class="export-dialog" aria-labelledby="export-title">
    <form id="export-form">
      <h2 id="export-title">Export theme</h2>
      <label for="export-name">File name</label>
      <div class="export-filename">
        <input id="export-name" type="text" required autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="export-extension" autofocus>
        <span id="export-extension">.pbcolors</span>
      </div>
      <div class="export-actions">
        <button id="btn-export-cancel" class="btn" type="button">Cancel</button>
        <button class="btn export-confirm" type="submit">Export</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      let prefs = null;

      try {
        const saved = localStorage.getItem('theme-editor-prefs');
        prefs = saved ? JSON.parse(saved) : null;
      } catch {
        prefs = null;
      }

      window.__themeEditorBootPrefs = prefs;
      window.__themeEditorPreviewEnabled = true;

      const mode = prefs?.mode === 'light' ? 'light' : 'dark';
      const globalLinked = prefs?.globalLinked !== false;
      const previewEnabled = window.__themeEditorPreviewEnabled;
      const previewVisible = previewEnabled && prefs?.previewVisible === true;
      const mobilePanel = previewVisible && prefs?.mobilePanel === 'preview' ? 'preview' : 'colors';

      const btnLight = document.getElementById('btn-light');
      const btnDark = document.getElementById('btn-dark');
      const btnGlobalLink = document.getElementById('btn-global-link');
      const btnPreviewToggle = document.getElementById('btn-preview-toggle');
      const previewPanel = document.querySelector('.preview-panel');
      const workspace = document.querySelector('.workspace');
      const btnMobileColors = document.getElementById('btn-mobile-colors');
      const btnMobilePreview = document.getElementById('btn-mobile-preview');

      btnLight.classList.toggle('active', mode === 'light');
      btnDark.classList.toggle('active', mode === 'dark');
      btnLight.setAttribute('aria-pressed', String(mode === 'light'));
      btnDark.setAttribute('aria-pressed', String(mode === 'dark'));
      btnGlobalLink.classList.toggle('linked', globalLinked);
      btnGlobalLink.title = globalLinked ? 'All colors linked (light = dark)' : 'Colors independent';
      btnGlobalLink.setAttribute('aria-pressed', String(globalLinked));
      btnGlobalLink.querySelector('.control-label').textContent = globalLinked ? 'Modes linked' : 'Modes unlinked';

      previewPanel.classList.toggle('collapsed', !previewVisible);
      workspace.classList.toggle('preview-hidden', !previewVisible);
      btnPreviewToggle.classList.toggle('active', previewVisible);
      btnPreviewToggle.disabled = !previewEnabled;
      btnPreviewToggle.title = previewEnabled
        ? previewVisible ? 'Hide preview panel' : 'Show preview panel'
        : 'Preview coming soon';
      btnPreviewToggle.setAttribute('aria-label', btnPreviewToggle.title);
      btnPreviewToggle.setAttribute('aria-expanded', String(previewVisible));
      btnPreviewToggle.querySelector('.control-label').textContent = previewVisible ? 'Hide preview' : 'Show preview';
      workspace.dataset.mobilePanel = mobilePanel;
      btnMobileColors.setAttribute('aria-pressed', String(mobilePanel === 'colors'));
      btnMobilePreview.setAttribute('aria-pressed', String(mobilePanel === 'preview'));
      btnMobilePreview.disabled = !previewEnabled;
      const mobileLayout = window.matchMedia('(max-width: 700px), (pointer: coarse) and (max-height: 500px)');
      document.body.classList.toggle('preview-editing', mobileLayout.matches && mobilePanel === 'preview' && prefs?.previewEditor?.open === true);
    })();
  </script>
  <script type="module" src="editor.js"></script>
</body>
</html>
